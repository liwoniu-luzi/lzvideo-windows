name: PureLive Windows Portable Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Windows
        run: flutter config --enable-windows-desktop

      - name: Resolve packages
        run: flutter pub get

      - name: Generate production AppConfig
        shell: pwsh
        run: |
          dart run tool/env.dart prod

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/[`"'"'"']//g')
          echo "version=${FULL_VERSION%%+*}" >> "$GITHUB_OUTPUT"
          echo "artifact_version=${FULL_VERSION/+/-}" >> "$GITHUB_OUTPUT"

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create Windows portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $bundle = "build\windows\x64\runner\Release"
          mkdir dist_windows -Force | Out-Null
          $portable = "dist_windows\pure_live-$version-windows-x64-portable.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "purelive-portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          Get-ChildItem $bundle -Force |
            Where-Object {
              $_.Name -notin @("AppData", "IPTV_CACHE")
            } |
            Copy-Item -Destination $temporary -Recurse -Force
          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          Write-Host "Created portable archive: $portable"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure_live-Windows-Portable
          path: dist_windows/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PureLive v${{ steps.version.outputs.version }} Windows Portable
          body: |
            ## PureLive v${{ steps.version.outputs.version }} Windows Portable
            - 修复直播间画面偶发黑屏问题
            - 新增主播下播自动停止录制并合并保存 MP4 视频
            - 解压即用，独立数据隔离
          files: |
            dist_windows/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
