name: PureLive Windows Release Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release (Portable & Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Flutter Windows
        run: flutter config --enable-windows-desktop

      - name: Resolve packages
        run: flutter pub get

      - name: Generate production AppConfig
        shell: pwsh
        run: |
          dart run enven --env-files .env,.env.prod --class-name AppConfig

      - name: Get version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/[`"'"'"']//g')
          echo "version=${FULL_VERSION%%+*}" >> "$GITHUB_OUTPUT"
          echo "artifact_version=${FULL_VERSION/+/-}" >> "$GITHUB_OUTPUT"

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create Windows portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.artifact_version }}"
          $bundle = "build\windows\x64\runner\Release"
          mkdir dist_windows -Force | Out-Null
          $portable = "dist_windows\PureLive-$version-windows-x64-portable.zip"
          $temporary = Join-Path $env:RUNNER_TEMP "purelive-portable"
          Remove-Item $temporary -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temporary -Force | Out-Null
          Get-ChildItem $bundle -Force |
            Where-Object {
              $_.Name -notin @("AppData", "IPTV_CACHE")
            } |
            Copy-Item -Destination $temporary -Recurse -Force
          Compress-Archive `
            -Path (Join-Path $temporary "*") `
            -DestinationPath $portable `
            -CompressionLevel Optimal `
            -Force
          Write-Host "Created portable archive: $portable"

      - name: Build Windows Setup installer (.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.version.outputs.version }}"
          $artifactVersion = "${{ steps.version.outputs.artifact_version }}"
          $temporary = Join-Path $env:RUNNER_TEMP "purelive-portable"
          $output = Join-Path $PWD "dist_windows"
          $iss = "windows\packaging\exe\local_release.iss"
          $isccCandidates = @(
            'iscc.exe',
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $isccCandidates | Where-Object { (Get-Command $_ -ErrorAction SilentlyContinue) -or (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host "Installing Inno Setup via choco..."
            choco install innosetup --version=6.7.1 -y --no-progress
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          Write-Host "Compiling setup installer with $iscc..."
          & $iscc "/DSourceDir=$temporary" "/DAppVersion=$version" "/DArtifactVersion=$artifactVersion" "/DOutputDir=$output" $iss
          Write-Host "Created setup installer in $output"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureLive-Windows-Release
          path: dist_windows/
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PureLive v${{ steps.version.outputs.version }} Windows Release
          body: |
            ## PureLive v${{ steps.version.outputs.version }} Windows Release
            - 彻底剔除第三方在线更新链接，接入自有 Cloudflare 专属 CDN 加速（免代理直连）
            - 修复 WebDAV 跨平台配置同步引起的播放黑屏问题
            - 修复 Windows 关机/重启时应用拦截与内存报错
            - 提供 EXE 安装版（支持自定义安装路径并在更新时无缝自动覆盖旧版本）与 ZIP 便携版
          files: |
            dist_windows/*.zip
            dist_windows/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
